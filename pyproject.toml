[project]
name = "fpl-model"
version = "0.1.0"
description = "Fantasy Premier League points-distribution model (Phase 0: data foundation)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1",
    "polars>=1.0",
    # Bridges DuckDB result sets to Polars without a pandas round-trip.
    "pyarrow>=17.0",
    # Windows ships no IANA timezone database, so `zoneinfo` cannot resolve a named zone
    # without this. Connections are pinned to UTC precisely so the common path never needs
    # a lookup, but any tz-aware value that does reach zoneinfo must not crash the suite.
    "tzdata>=2024.1",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "pulp>=3.2,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fpl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "archive: requires the downloaded archive database (jobs.build_db)",
]

[tool.ruff]
src = ["src", "tests"]
line-length = 100
target-version = "py312"
# Vendored third-party UI/UX skills (`.claude/skills/`) are copied unmodified from
# upstream (MIT; see .claude/skills/THIRD-PARTY-SKILLS.md); the repo format gate must
# not require reformatting them.
extend-exclude = [".claude/skills"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "PT", "SIM", "RUF"]
ignore = [
    # Scoring rules read most naturally with explicit branches.
    "SIM102",
]

[tool.ruff.lint.per-file-ignores]
# Tests assert against measured constants; magic values are the point.
# PT018: `assert row is not None and row[0] == n` narrows DuckDB's Optional fetchone()
# result in the same line that asserts on it. Splitting it doubles the line count of
# every database assertion without making a failure any easier to read.
# SIM117: a `pytest.raises` nested inside a resource context is deliberate. Merging it
# into the same `with` widens the assertion to cover the context manager's __exit__, so
# a teardown error would satisfy a test that meant to pin a specific call's failure.
"tests/*" = ["N806", "PT018", "SIM117"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
# DuckDB, Polars, and PuLP ship partial or no stubs; keep strictness on our own code.
[[tool.mypy.overrides]]
module = ["duckdb.*", "polars.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ['pulp.*']
ignore_missing_imports = true
