# FPL scoring rules, 2026-27. THE LIVE RULESET.
#
# R2: scoring rules are configuration, not code.
#
# Provenance: initially transcribed from section 5 of the specification, then compared
# with the official bootstrap-static payload captured at 2026-07-27T01:46:09Z. Run
#
#     python -m fpl.jobs.verify_rules --payload <path-to-bootstrap-static.json>
#
# which rewrites the verification block with fields the payload actually exposes. The
# live block confirms 17 configured fields but omits seven thresholds/units. Those seven
# are confirmed separately against official published scoring sources below.
#
# Three separate notions of trust are tracked deliberately, because they differ:
#   payload_confirmed  -- the value matches the live game_config.scoring
#   authoritative_sources -- official published rules state the value
#   replay_exercised   -- the rule actually fired on real recorded data
# A value can be confirmed but never exercised. goals_scored.GK is exactly that
# case and stays in `unverified` regardless of what the payload says.

ruleset_id: "2026_27"
season: "2026-27"

appearance:
  short_play_points: 1
  long_play_points: 2
  long_play_minutes: 60

goals_scored:
  GK: 10
  DEF: 6
  MID: 5
  FWD: 4

assists: 3

clean_sheets:
  minimum_minutes: 60
  points:
    GK: 4
    DEF: 4
    MID: 1
    FWD: 0

goals_conceded:
  points_per_unit: -1
  unit: 2
  positions: ["GK", "DEF"]

saves:
  points_per_unit: 1
  unit: 3
  positions: ["GK"]

penalties_saved: 5
penalties_missed: -2
own_goals: -2
yellow_cards: -1
red_cards: -3

defensive_contribution:
  points: 2
  thresholds:
    DEF: 10
    MID: 12
    FWD: 12

bonus:
  mode: "passthrough"
  ranked_points: [3, 2, 1]

# --------------------------------------------------------------------------------------
# Bonus Points System (BPS) -- the EXACTLY-COMPUTABLE part only.
#
# BPS is an Opta-driven per-player score; bonus (3/2/1) goes to the top three BPS players in
# each match. The full BPS formula depends on Opta inputs this repository does not hold (key
# passes, big chances, crosses, pass-completion %, fouls, dribbles, CBI inside/outside split,
# saves inside/outside box, big-chance saves), so it cannot be reconstructed exactly. An archive
# measurement shows ~96% of awarded bonus goes to players with a goal/assist (75.5%) or a clean
# sheet (20.9%) -- all computable here -- and only ~3.5% is pure hidden Opta.
#
# ONLY BPS values verified against an official Premier League source are recorded below. Every
# other BPS component is modelled by the development-only hybrid simulator's empirical residual
# and is named under verification.residual_gaps. calculate_points NEVER reads this block; it
# feeds fpl.models.bps_bonus only.
#
# Values are the OFFICIAL 2026/27 BPS: goals GK/DEF 12, MID 18, FWD 24; assist 9; clean sheet
# GK/DEF 12; penalty save 7 (dropped from 8 for 2026/27); CBI +1 per 3 (was per 2). Penalty
# goal is a flat 12 in the BPS, but the archive carries no penalties-scored flag, so penalty
# goals cannot be distinguished from open-play goals -- the delta folds into the residual.
bps:
  goals:
    GK: 12
    DEF: 12
    MID: 18
    FWD: 24
  penalty_goal: 12
  assists: 9
  clean_sheets:
    points:
      GK: 12
      DEF: 12
  penalties_saved: 7
  clearances_blocks_interceptions:
    points: 1
    unit: 3
  verification:
    sources:
      - source_id: premier_league_bps_explainer
        title: "How the FPL Bonus Points System works"
        url: "https://www.premierleague.com/en/news/106533"
        confirmed:
          - goals.GK
          - goals.DEF
          - goals.MID
          - goals.FWD
          - penalty_goal
          - assists
          - clean_sheets.points.GK
          - clean_sheets.points.DEF
        capture_status: "byte_capture_unavailable_network_blocked_403"
        notes: >
          Official BPS explainer. States the base BPS values: goalkeepers and defenders 12,
          midfielders 18 and forwards 24 for a goal; 9 for an assist; 12 for a GK/DEF clean
          sheet; a flat 12 for a penalty goal. The page returned HTTP 403 to the build
          environment's fetcher, so a reproducible sha256 byte capture could not be taken here;
          the values are transcribed from the official source and recorded for later capture.
      - source_id: premier_league_2026_27_bps_changes
        title: "What's new in 2026/27 Fantasy: Changes to Bonus Points System"
        url: "https://www.premierleague.com/en/news/4679946/whats-new-in-202627-fantasy-changes-to-bonus-points-system"
        confirmed:
          - penalties_saved
          - clearances_blocks_interceptions.points
          - clearances_blocks_interceptions.unit
        capture_status: "byte_capture_unavailable_network_blocked_403"
        notes: >
          Official 2026/27 BPS-change article. Confirms: the penalty-save BPS drops from 8 to 7
          (the goalkeeper earns the extra BPS back through a new big-chance-save metric this
          repository cannot observe); CBI now scores +1 BPS per 3 actions (was per 2); the
          tackle-penalty metric is removed; and the save inside/outside-box split is removed so
          only inside-box saves score +1 BPS each. Because the data has neither the inside/outside
          location nor the big-chance flag, saves are NOT uniform per recorded save and are folded
          into the residual rather than guessed. Page returned HTTP 403 to the fetcher; no sha256.
    # BPS components deliberately NOT in the exact part -- modelled by the empirical residual.
    # Each is either not byte-verifiable here or requires an Opta input the data lacks.
    residual_gaps:
      - "minutes/appearance BPS tiers (not byte-verified here)"
      - "saves BPS (inside/outside-box + big-chance split absent; not a uniform per-save value)"
      - "yellow_cards, red_cards, own_goals, penalties_missed, goals_conceded BPS (not byte-verified here)"
      - "penalty-goal vs open-play-goal delta (archive has no penalties-scored flag)"
      - "clearances_blocks_interceptions before 2025-26 (unmeasured; NULL, never zero-filled)"
      - "hidden Opta BPS: key passes, big chances, crosses, pass-completion %, fouls, dribbles, tackles-won, recoveries, errors, dispossessions, offsides (~3.5% of awarded bonus)"

verification:
  payload_captured_at: "2026-07-27T01:46:09Z"
  payload_sha256: "79203f6828a610953c0508acc1687df558347d28c997652c14b8bf072a36ab30"
  payload_confirmed:
    - appearance.long_play_points
    - appearance.short_play_points
    - assists
    - clean_sheets.points.DEF
    - clean_sheets.points.GK
    - clean_sheets.points.MID
    - defensive_contribution.points
    - goals_conceded.points_per_unit
    - goals_scored.DEF
    - goals_scored.FWD
    - goals_scored.MID
    - own_goals
    - penalties_missed
    - penalties_saved
    - red_cards
    - saves.points_per_unit
    - yellow_cards
  authoritative_sources:
    - source_id: premier_league_scoring_points
      title: "FPL basics explained: Scoring points"
      url: "https://www.premierleague.com/en/news/2174909"
      published_on: "2025-07-01"
      captured_at: "2026-07-27T02:53:47Z"
      sha256: "a684e8e6404163d8eaa57766c105108ee530b81b5f1686e8015613bf86e54138"
      confirmed:
        - appearance.long_play_minutes
        - clean_sheets.minimum_minutes
        - goals_conceded.unit
        - saves.unit
        - defensive_contribution.thresholds.DEF
        - defensive_contribution.thresholds.MID
        - defensive_contribution.thresholds.FWD
      notes: >
        The official scoring reference states the 60-minute appearance and clean-sheet
        thresholds, the two-goal and three-save units, and all three defensive-contribution
        thresholds. It was captured from the official site after 2026-27 FPL launched.
    - source_id: premier_league_2026_27_defensive_contributions
      title: "What's happening with defensive contribution points in 2026/27 Fantasy?"
      url: "https://www.premierleague.com/en/news/4361991/whats-happening-with-defensive-contribution-points-in-202627-fantasy"
      published_on: "2026-07-20"
      captured_at: "2026-07-27T02:53:47Z"
      sha256: "382d5cb41df38ad2484440127f23fa04bfece837a840fb4d400435f3001deb39"
      confirmed:
        - defensive_contribution.thresholds.DEF
        - defensive_contribution.thresholds.MID
        - defensive_contribution.thresholds.FWD
      notes: >
        Current-season confirmation that defenders need 10 contributions and midfielders
        and forwards need 12 for the two-point award.
  # 2026-27 has not been played, so nothing can be replay-exercised yet. The
  # 2025_26 ruleset is byte-identical in every scoring component and IS
  # replay-verified at 29,747/29,747; that is the strongest evidence available
  # for these values today, but it is evidence about last season's rules.
  replay_exercised: []
  unverified:
    goals_scored.GK: >
      Untested either way. No goalkeeper scored in the validation data -- measured
      0 GK goals across 29,747 rows of 2025-26 -- so no replay can exercise this
      value. A payload confirms the number FPL publishes; it does not confirm the
      calculator handles it. Treat as unvalidated.
    clean_sheets.points.FWD: >
      Zero-valued, so a correct 0 is indistinguishable from an omitted rule. No
      replay can tell the two apart.
