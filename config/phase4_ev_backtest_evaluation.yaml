# Phase 4 Stage D / Prospective EV Walk-forward Backtest evaluation contract.
#
# Defined before any EV backtest execution. Evaluates prospective EV ranking and
# points-distribution performance over GW29-38 of the 2025-26 season.
#
# A candidate/backtest cannot choose easier gameweeks, populations, metrics, or
# lift gates after seeing its results.

contract_version: "1.1"
phase: 4

amendments:
  - version: "1.1"
    date: "2026-08-06"
    candidates_evaluated_before_amendment: 0
    changed: >-
      Corrected two frozen component identities to the constants the executed suite actually
      carries: components.saves 'league_constant_save_rate_v1' ->
      'gk_saves_poisson_from_team_conceded_v1' (fpl.models.gk_saves_v1.NAME) and
      components.defensive_contribution 'team_rescaled_dc_v1' ->
      'trailing_dc_threshold_hit_bernoulli_v1' (fpl.models.defensive_contribution_v1.NAME).
      Added components.assists_architecture and components.bps_simulation to name the two
      inline architectures that have no model NAME constant. No horizon, population, metric,
      support, Monte-Carlo, or scoring/calibration value changed.
    reason: >-
      Neither original string existed anywhere in the repository, and both misdescribed the
      model they claimed to freeze. The saves component is fitted fold-locally
      (gk_saves_v1.py:104-124); the league constant is only its cold-start fallback. The
      defensive-contribution component applies NO destination-team rescaling - it shrinks
      toward a fold-local POSITION hit rate (defensive_contribution_v1.py:128-136) - so
      'team_rescaled_dc_v1' asserted exactly the property AGENTS.md requires and the code does
      not implement. A pre-registration that names a non-existent model cannot pin anything.
    evidence: >-
      Zero evaluations had been executed under contract 1.0: no results artifact exists, no
      run of fpl.validate.dev_ev_backtest had been performed, and no primary or comparator
      number had been observed. The correction is therefore a pre-registration repair before
      first execution, not a post-hoc amendment of a judged gate. Enforced going forward by
      tests/test_phase4_ev_backtest_evaluation.py, which asserts each frozen identity equals
      the implementation constant that default_component_suite() actually installs.

horizon:
  season: "2025-26"
  start_gw: 29
  end_gw: 38
  expected_selected_gws: 10
  expected_fixtures: 99
  expected_player_fixture_rows: 8224
  split_unit: observed_gameweek
  cutoff_proxy: first_kickoff_of_gameweek

support:
  max_fixture_points: 34

# Every name below is the implementation constant the executed suite installs, asserted
# against the code by tests/test_phase4_ev_backtest_evaluation.py. `assists_architecture` and
# `bps_simulation` name inline architectures that carry no model NAME constant; they are pinned
# here so the contract states what was run rather than leaving it implicit.
components:
  stage_a: trailing_goals_attack_defence
  minutes: concentration_adaptive_shrinkage_player_minutes_v3
  saves: gk_saves_poisson_from_team_conceded_v1
  defensive_contribution: trailing_dc_threshold_hit_bernoulli_v1
  bps_residual: trailing_ict_ridge_residual_v1
  assists_architecture: ev_backtest_adapter_coupled_team_share_assists
  bps_simulation: points_composition_joint_fixture_bps_monte_carlo

primary_architecture:
  name: prospective_v3_coupled_seasonal_bonus
  attacking: minutes_gated_coupled_team_share_attacking_goals_v3
  assists: coupled_team_share_assists
  appearance: seasonal_equal_weighted_trailing_5
  seasonal_appearance_min_rows: 3
  prior_season_blend_weight: 0.0
  historical_availability_multiplier: 1.0
  scoring_rules: "2026_27"
  bonus_simulation: joint_fixture_bps_monte_carlo

diagnostic_comparator:
  name: prospective_v1_independent_seasonal_bonus
  attacking: xg_informed_trailing_player_goals_v1
  assists: xa_informed_trailing_player_assists_v1
  role: development_diagnostic_only_not_a_promotion_gate

monte_carlo:
  draws: 2000
  seed: 202627

target_population:
  eligible: minutes_not_null
  include_zero_minutes: true
  scoring_ruleset: "2026_27"

metrics:
  ranking:
    - ndcg_at_20
    - top_20_actual_points_capture_ratio
    - top_20_overlap
    - spearman_ev_vs_actual_within_gw_position
    - spearman_ev_vs_actual_cumulative
  calibration:
    - ev_total_vs_actual_total
    - signed_bias
    - ev_actual_ratio
    - mae
    - rmse
  proper_distribution:
    - mean_log_score
    - mean_ranked_probability_score
    - randomized_pit_80

scoring_calibration:
  log_probability_floor: 1.0e-12
  randomized_pit_band: [0.1, 0.9]
  randomized_pit_seed: 202627
