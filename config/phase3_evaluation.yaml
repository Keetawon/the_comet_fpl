# Phase 3 Stage C (player attacking goals) evaluation and promotion contract.
#
# Defined before any Stage C model code. A candidate cannot choose easier folds,
# populations, bin shapes, baselines, metrics, or lift gates after seeing its
# results.

contract_version: "1.4"
phase: 3

amendments:
  - version: "1.1"
    date: "2026-07-31"
    candidates_evaluated_before_amendment: 0
    changed: >
      additive_stage_c_attacking_candidate_v1_pre_registration_only_no_population_roster_baseline_metric_or_gate_field_changed
    reason: >
      Pre-register Candidate V1 xg_informed_trailing_player_goals_v1: the v1.0
      trailing-player goal-rate baseline with its recent GOALS signal replaced by recent
      expected_goals where xG is measured and finishing shrunk almost fully to the positional
      mean, falling back to the exact v1.0 trailing-player baseline where xG is unmeasured. This
      block is additive: it changes no v1.0 population, target roster, baseline, metric, gate,
      seed, or calibration field and is judged by the unchanged v1.0 promotion gate.
    evidence: >
      docs/research-adaptation.md (xG beats recorded goals as the attacking signal where xG is
      measured, judged within xG-covered seasons 2023-24+; finishing does not persist within
      position FWD 0.138 / MID 0.060 / DEF -0.103 so it is shrunk almost fully to the positional
      mean); config xg_signal_policy.use_when_measured_within_covered_seasons.
  - version: "1.2"
    date: "2026-08-01"
    candidates_evaluated_before_amendment: 1
    changed: >
      additive_stage_c_attacking_candidate_v2_pre_registration_only_no_population_roster_baseline_metric_or_gate_field_changed
    reason: >
      Pre-register Candidate V2 coupled_team_share_attacking_goals_v2: a structural change from
      V1 that allocates the frozen Stage A team-goal expectation among a club's players by a
      trailing attacking share (Poisson thinning, rate_i = lambda_team * share_i) instead of
      predicting each player independently. The Stage A model is the frozen
      trailing_goals_attack_defence baseline refit fold-local (kickoff_time < as_of) and reused
      not reimplemented; club identity is stable team_code resolved from the season-qualified
      team_id via mart_dim_team, never a bare cross-season team_id. The R6 appearance-vs-rate
      correction computes each player's trailing attacking signal (expected_goals where measured
      else threat) over APPEARED prior rows only (minutes > 0) and normalises the club's eligible
      roster in the fixture to sum to one; zero-minute target rows stay scored. This block is
      additive: it changes no v1.0/1.1 population, target roster, baseline, metric, gate, seed, or
      calibration field and is judged by the unchanged v1.0 promotion gate.
    evidence: >
      docs/research-adaptation.md (team strength combines multiplicatively attack x opponent
      defence corr 0.439 vs subtractive 0.070, so a team-goal expectation is the right scale to
      allocate; xG and threat both persist within position and threat is measured for every season
      incl. 2021-22 which has no xG); config stage_c_candidate_v2.stage_a_model and
      appeared_rows_filter.
  - version: "1.3"
    date: "2026-08-01"
    candidates_evaluated_before_amendment: 2
    changed: >
      additive_stage_c_attacking_candidate_v3_pre_registration_only_no_population_roster_baseline_metric_or_gate_field_changed
    reason: >
      Pre-register Candidate V3 minutes_gated_coupled_team_share_attacking_goals_v3: Candidate V2
      with each player's coupled team-share rate gated by an explicit Stage B minutes input,
      fully separating appearance probability from per-appearance attacking rate (R6). The minutes
      input is the frozen Stage B BASELINE trailing_5_player_minutes (a deterministic baseline, not
      an unpromoted candidate), computed fold-local on kickoff_time < as_of; p_play =
      P(minutes >= 1) = 1 - dist[0]. The rate is lambda_team * renormalised(share_i * p_play_i) so
      the team total stays at lambda_team; it reduces exactly to V2 when minutes gating is disabled.
      This block is additive: it changes no v1.0/1.1/1.2 population, target roster, baseline,
      metric, gate, seed, or calibration field and is judged by the unchanged v1.0 promotion gate.
    evidence: >
      docs/research-adaptation.md and the Stage B baseline contract (trailing_5_player_minutes is a
      frozen v1.0 baseline, so it introduces no unpromoted-candidate dependency); the minutes input
      is a stated development proxy (a baseline on unversioned archive history), an additional
      reason the verdict is development-only; config stage_c_candidate_v3.minutes_source and
      conservation.
  - version: "1.4"
    date: "2026-08-06"
    candidates_evaluated_before_amendment: 3
    changed: >
      additive_stage_c_attacking_candidate_v4_pre_registration_only_no_population_roster_baseline_metric_or_gate_field_changed
    reason: >
      Pre-register Candidate V4 exposure_weighted_xg_team_share_attacking_goals_v4: a controlled test
      of whether separating per-minute attacking productivity from predicted exposure beats the raw
      per-appearance xG share of V3. It keeps V3's team-coupling / conservation skeleton and changes
      THREE things at once: (i) the per-player allocation signal becomes shrunk_xg_per_min *
      E[minutes] where shrunk_xg_per_min is a per-MINUTE rate (sum(xG) / sum(minutes) over the
      Option-A trailing appeared window -- per-90 is only a reporting conversion, 90 * rate_per_min,
      and is not how the rate is defined), shrunk toward a fold-local POSITION-SPECIFIC xG/min prior
      by the FIXED prior_minutes = 90 (one full-match equivalent); (ii) the cold-start prior changes
      from V3's committed POOLED all-position signal mean to that fold-local POSITION-SPECIFIC xG/min
      prior; and (iii) the signal is xG-ONLY with NO threat fallback (V3 reads
      expected_goals_else_threat; V4 never reads threat). E[minutes] is derived from the frozen Stage
      B BASELINE trailing_5_player_minutes distribution via fold-local GLOBAL bin means (bin 0 exactly
      0; deterministic empty-bin fallbacks [0.0, 30.0, 75.0, 90.0]), never from
      points_composition.representative_minutes. The team scale lambda_team (the frozen
      trailing_goals_attack_defence baseline, refit fold-local) is allocated by these weights so
      sum_i goal_lambda_i == lambda_team (underlying Poisson-rate conservation, in expectation -- NOT
      per-draw realised-count conservation). NULL xG is unmeasured and never zero-filled and
      contributes neither to the signal sum nor to the minutes sum. The minutes model is the frozen
      trailing_5_player_minutes baseline (NOT Stage B Candidate V3), so productivity and minutes are
      not changed simultaneously. This block is additive: it changes no v1.0/1.1/1.2/1.3 population,
      target roster, baseline, metric, gate, seed, or calibration field and is judged by the
      unchanged v1.0 promotion gate.
    evidence: >
      docs/phase3-stage-c-attacking-candidate-v4-design.md (per-minute productivity x predicted
      exposure vs raw per-appearance xG share; per-minute weighting sum(xG)/sum(minutes) avoids
      cameo over-influence that mean-per-appearance suffers); config stage_c_candidate_v4.prior_minutes,
      .expected_minutes, and .signal (expected_goals_only_no_fallback).

target:
  entity: player
  grain: season_player_code_fixture
  outcome: goals_distribution
  downstream_points_ruleset: "2026_27"
  identity_policy: code_is_cross_season_player_key

target_roster:
  historical_roster_status: archive_proxy_unversioned_at_real_deadline
  historical_source: archive_player_fixture_identity_schedule_proxy_projected_from_target_rows
  proxy_columns:
    - season
    - gw
    - fixture
    - kickoff_time
    - code
    - position
    - team_id
    - opponent_team_id
    - was_home
  minutes_role: label_outside_model_facing_projection
  live_prospective_registry: versioned_player_registry_selected_known_at_le_as_of_before_model_sees_entity_team_position
  cross_season_team_identity: season_qualified_team_id_resolved_to_stable_team_code
  point_in_time_disclaimer: not_fully_reconstructable_pit_at_real_deadline

population:
  include_zero_minutes: true
  eligible_outcome: minutes_not_null
  registered_population: mart_fact_player_fixture_minutes_not_null

cutoff:
  split_unit: observed_gameweek
  prediction_time: archive_first_kickoff_proxy_for_gameweek_deadline
  observed_results: "kickoff_time < as_of"
  snapshot_versions: "known_at <= as_of"

training:
  window: expanding
  minimum_observed_gameweeks: 8
  no_minimum_player_history_exclusion: true
  cold_start_policy: every_eligible_row_receives_fallback_distribution
  fit_transforms_within_fold: true
  preserve_nulls: true
  seed: 202627

xg_signal_policy:
  xg_handling: use_when_measured_within_covered_seasons
  xg_covered_seasons_judging: true
  xg_covered_seasons:
    - "2023-24"
    - "2024-25"
    - "2025-26"
  finishing_persistence: shrink_almost_fully_to_positional_mean
  fallback_signal: threat

stage_c_candidate_v1:
  name: xg_informed_trailing_player_goals_v1
  development_only: true
  development_only_reason: archive_target_roster_and_first_kickoff_cutoff_are_unversioned_proxies_and_archive_evidence_shaped_the_design
  grain: season_player_code_fixture
  identity: stable_code
  history_population: up_to_5_most_recent_prior_player_fixture_rows_including_zero
  history_order: kickoff_time_then_season_then_fixture
  history_window: 5
  history_observed_results: "kickoff_time < as_of"
  signal: expected_goals_where_measured_else_fallback_to_v1_trailing_baseline
  xg_handling: use_when_measured_per_row_null_is_unmeasured
  positional_goal_mean: fold_local_mean_goals_per_appearance_at_target_position_equal_to_v1_positional_baseline
  positional_xg_mean: fold_local_mean_expected_goals_per_appearance_over_xg_measured_prior_rows_at_target_position
  trailing_xg_shrinkage: "shrunk_xg_equals_(sum_x_plus_alpha_times_pos_x)_over_(m_plus_alpha)"
  finishing_policy: finishing_shrunk_almost_fully_to_positional_mean_keep_0.05
  finishing_term: "0.05_times_player_finishing_plus_0.95_times_positional_finishing"
  rate: rate_equals_shrunk_xg_plus_finishing_term_clamped_at_zero
  fallback_to_v1: when_no_xg_measured_trailing_row_or_no_positional_xg_mean_rate_is_exact_v1_trailing_shrunk_goals_rate
  cold_start_fallback: when_n_equals_0_rate_is_positional_goal_mean_equal_to_v1_baseline
  reduces_to_v1_baseline: when_all_trailing_xg_unmeasured_candidate_equals_v1_trailing_baseline_bit_for_bit
  alpha: 5.0
  finishing_keep: 0.05
  poisson_max_goals: 10
  estimator: poisson_goal_count_distribution_over_0_to_10
  additional_smoothing: none
  scoring_floor_role: existing_1e-12_floor_is_scoring_only_not_model_smoothing
  selected_parameter: none_fixed_closed_form_estimator_no_grid_no_inner_walk_forward
  fit_scope: positional_means_and_player_histories_recomputed_within_each_fold
  target_label_policy: target_labels_never_enter_model_inputs
  target_position_source: existing_unversioned_target_roster_proxy_current_position
  null_policy: preserve_nulls
  zero_minutes_policy: include_in_history_and_training
  assistant_manager_policy: excluded_upstream_element_type_5
  double_gameweek_policy: "fixture_rows_remain_separate_same_pre_gameweek_state_no_within_gameweek_absorption"
  monte_carlo: out_of_scope_closed_form

