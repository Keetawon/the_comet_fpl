baselines:
  stage_c_attacking:
    - positional_goal_rate_poisson
    - trailing_player_goal_rate_poisson
  definitions:
    - name: positional_goal_rate_poisson
      identity: target_position
      population: all_prior_eligible_rows_at_target_position
      order: none_applicable_all_rows
      window: null
      additive_smoothing: none
      fallback: unsmoothed_all_position_prior_rows
      estimator: positional_mean_goals_per_appearance_poisson
    - name: trailing_player_goal_rate_poisson
      identity: stable_code
      population: up_to_5_most_recent_prior_player_fixture_rows_including_zero
      order: kickoff_time_then_season_then_fixture
      window: 5
      additive_smoothing: none
      fallback: positional_goal_rate_poisson
      estimator: player_goals_per_appearance_shrunk_to_positional_mean_poisson
  excluded:
    - fpl_ep_next_recorded_rules

metrics:
  primary: mean_log_score
  primary_direction: lower_is_better
  proper_distribution:
    - mean_log_score
    - mean_ranked_probability_score
  binary_guardrails:
    - mean_brier_at_least_one_goal
  calibration:
    - randomized_pit
    - pit_interval_80_coverage
    - reliability_at_least_one_goal
  reliability_buckets_carry_n: true

promotion:
  compare_against: best_eligible_required_stage_c_attacking_baseline
  comparison_population: same_eligible_predictions
  relative_lift_formula: "(baseline - candidate) / abs(baseline)"
  guardrail_comparison: best_baseline_per_metric
  minimum_primary_relative_lift: 0.01
  maximum_ranked_probability_score_relative_regression: 0.0
  maximum_brier_relative_regression_at_least_one_goal: 0.0
  pit_interval_80_maximum_absolute_error: 0.05
  minimum_fold_count: 181
  minimum_prediction_coverage: 1.0
  require_no_season_mean_log_score_regression: true
  require_zero_leakage_failures: true

reporting:
  dimensions:
    - fold
    - season
    - position
    - home_away
  counts:
    - predictions
    - exclusions
    - cold_starts
    - uncertainty

historical_features:
  availability_status: excluded_unavailable_in_archive
  point_in_time_only: reconstructable_fields_only
  live_availability_prospective_candidate: separately_named_prospective_only
  historical_score_is: development_number_not_upper_bound

scoring_calibration:
  log_probability_floor: 1.0e-12
