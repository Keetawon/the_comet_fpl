# Data sources. Section 3 of the specification.
#
# The archive is the historical backfill only. It stopped weekly updates after
# 2024-25 and now refreshes ~3x per season, so it must never be depended on
# in-season -- that is what the daily snapshot (R5) is for.

archive:
  base_url: "https://raw.githubusercontent.com/vaastav/Fantasy-Premier-League/master/data"
  seasons:
    - "2021-22"
    - "2022-23"
    - "2023-24"
    - "2024-25"
    - "2025-26"
  files:
    merged_gw: "gws/merged_gw.csv"
    fixtures: "fixtures.csv"
    teams: "teams.csv"
    players_raw: "players_raw.csv"

live_api:
  base_url: "https://fantasy.premierleague.com/api"
  endpoints:
    bootstrap_static: "bootstrap-static/"
    fixtures: "fixtures/"
    element_summary: "element-summary/{element_id}/"
    event_live: "event/{gw}/live/"
    entry: "entry/{manager_id}/"
    entry_event_picks: "entry/{manager_id}/event/{event}/picks/"
    entry_transfers: "entry/{manager_id}/transfers/"
    entry_history: "entry/{manager_id}/history/"
  # Be polite: roughly 1 request/second (section 3.1).
  min_request_interval_seconds: 1.0
  timeout_seconds: 30.0
  max_retries: 4
  # Exponential backoff base; delays are 2s, 4s, 8s, 16s.
  retry_backoff_base_seconds: 2.0

current_season:
  season: "2026-27"
  ruleset_id: "2026_27"
  # GW1 deadline, from the specification.
  gw1_deadline: "2026-08-21T17:30:00Z"

# Local paths, relative to the repository root.
paths:
  database: "data/fpl.duckdb"
  archive_cache: "data/archive"
  snapshots: "snapshots"

# Locally-pulled FBref defensive-actions dump (B-path; see
# docs/phase3-stage-c-fbref-recipe.md). fbref.com is unreachable from the build environment,
# so this is a CSV the operator pulls where FBref is reachable and commits -- never fetched
# here. No secret is needed; if one ever is, load it from the environment and keep it out of
# the repo. Treated as an unverified assumption until the 2025-26 overlap gate passes.
defensive_actions_dump:
  # Relative to the repository root; points at the canonical-column CSV.
  csv_path: "data/fbref_defensive_actions.csv"
  overlap_season: "2025-26"
  provenance:
    source: "FBref (StatsBomb)"
    license: "non-commercial use; attribution required"
    pulled_with: "soccerdata (FBref match logs: defense + misc) -- see recipe"
    # ISO date the operator pulled it; null until a dump is actually committed.
    pulled_on: null

# --------------------------------------------------------------------------------------
# Premier League SDP (V2 football data layer).
#
# The JSON backend behind premierleague.com. It is undocumented private infrastructure, not
# a published API, so every value below is an assumption until `fpl.jobs.audit_pl_sdp` has
# observed a real payload and written results/pl_sdp_identity_audit.json.
#
# Consequences that are designed for rather than hoped away:
#   * response envelopes may be a bare list or a paged container -- the client tries an
#     ordered list of container keys and raises rather than guessing;
#   * `season` is a numeric provider id whose mapping to a season label is NOT known here.
#     `season_ids` starts empty; `fpl.jobs.audit_pl_sdp --probe` discovers it and prints the
#     block to paste back. An unmapped season fails closed instead of fetching the wrong year;
#   * additive field changes are tolerated (the tall metric store keeps everything);
#     incompatible ones fail visibly.
#
# Pacing is deliberately slower than the FPL client: this is someone else's website backend.
pl_sdp:
  base_url: "https://sdp-prem-prod.premier-league-prod.pulselive.com"
  competition: 8
  endpoints:
    seasons: "/api/v2/competitions/{competition}/seasons"
    matches: "/api/v2/matches"
    match: "/api/v2/matches/{match_id}"
    match_stats: "/api/v3/matches/{match_id}/stats"
    match_lineups: "/api/v3/matches/{match_id}/lineups"
    match_events: "/api/v1/matches/{match_id}/events"
  # Season label -> provider season id. Empty until an audit/probe run fills it in; an
  # unmapped label is refused rather than guessed.
  season_ids: {}
  # Candidate provider season ids a probe run sweeps when `season_ids` has no entry.
  probe_season_id_minimum: 1
  probe_season_id_maximum: 800
  # ~1 request per 1.5s. Conservative on purpose.
  min_request_interval_seconds: 1.5
  timeout_seconds: 30.0
  max_retries: 4
  retry_backoff_base_seconds: 2.0
  # Pagination. `page_size` is sent as the provider's page-size parameter when the endpoint
  # accepts one; `maximum_pages` bounds a runaway loop if the provider ignores paging.
  page_size: 100
  maximum_pages: 40
  # A stats payload smaller than this is treated as an error, not as an empty match.
  minimum_payload_bytes: 32
  # Metric dictionary, relative to config/.
  metric_dictionary: "pl_sdp_metrics.yaml"
