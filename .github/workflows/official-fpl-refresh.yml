name: Hourly official FPL reporting

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: official-fpl-publication
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    environment: production-fpl
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          enable-cache: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install locked publication environment
        run: uv sync --frozen --extra public-data
      - name: Capture, validate and publish current official reporting
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.FPL_R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.FPL_R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT_URL: ${{ secrets.FPL_R2_ENDPOINT_URL }}
          R2_BUCKET: ${{ vars.FPL_R2_BUCKET }}
        run: uv run python -m fpl.jobs.refresh_official_fpl --output "$RUNNER_TEMP/official-fpl"
      - name: Retain public capture evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: official-fpl-${{ github.run_id }}
          path: ${{ runner.temp }}/official-fpl
          if-no-files-found: ignore
          retention-days: 30
